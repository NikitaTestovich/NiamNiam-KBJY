name: Android verification

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check files intended for publication
        working-directory: .
        run: python3 scripts/ci/verify_public_files.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Catalog intake tests
        working-directory: .
        run: node --test catalog-intake/*.test.cjs
      - name: Verify generated reference recipes
        working-directory: .
        run: python3 data/build_reference_recipes.py --check
      - name: Unit tests, coverage, lint and APK
        run: bash ./gradlew :app:verifyUnitCoverageBaseline :app:lintDebug :app:assembleDebug --no-daemon
      - name: Read exported XLSX workbooks
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/xlsx-check"
          "$RUNNER_TEMP/xlsx-check/bin/python" -m pip install --disable-pip-version-check openpyxl==3.1.5 et-xmlfile==2.0.0
          "$RUNNER_TEMP/xlsx-check/bin/python" scripts/ci/verify_xlsx_export.py
      - name: Verify result gate and executed unit tests
        if: always()
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 scripts/ci/verify_test_results.py android/app/build/test-results/testDebugUnitTest
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-coverage-lint
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NiamNiam-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android tests and coverage
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: bash ./gradlew :app:createDebugAndroidTestCoverageReport --no-daemon
      - name: Require executed Android tests
        if: always()
        run: python3 scripts/ci/verify_test_results.py android/app/build/outputs/androidTest-results/connected
      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-tests-coverage
          path: |
            android/app/build/reports/androidTests/
            android/app/build/reports/coverage/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14

  merge-check:
    if: always()
    needs: [unit-lint-build, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs
        env:
          UNIT_RESULT: ${{ needs.unit-lint-build.result }}
          ANDROID_RESULT: ${{ needs.android-tests.result }}
        run: test "$UNIT_RESULT" = success && test "$ANDROID_RESULT" = success
